
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CampusRent — Landlord</title>

<!-- Leaflet CSS/JS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<style>
:root {
  --brand:#2b7aa0;
  --bg:#f7f8fb;
  --muted:#6f7b86;
  --card-shadow:0 8px 18px rgba(20,20,20,0.06);
}

body { margin:0; background:var(--bg); font-family:Arial; }
.topbar { background:white; padding:12px; display:flex; gap:10px; flex-wrap:wrap; border-bottom:1px solid #ddd; }
.btn { background:var(--brand); color:white; padding:8px 14px; border:none; border-radius:8px; cursor:pointer; }
.btn.ghost { background:#eee; color:#222; }
.hidden { display:none; }
.container { padding:12px; }
.card { background:white; padding:12px; border-radius:10px; margin-bottom:12px; box-shadow:0 3px 10px rgba(0,0,0,0.08); }
.input, textarea { width:100%; padding:8px; border-radius:8px; border:1px solid #ccc; margin-bottom:8px; }
#myPropsList { display:flex; flex-wrap:wrap; gap:12px; }
/* Responsive */
@media screen and (max-width:768px) {
  body { flex-direction:column; }
  .grid { grid-template-columns:1fr; }
  #myPropsList { justify-content:center; flex-wrap:wrap; }
  .prop-thumb { width:100%; max-width:200px; height:auto; }
  .sidebar { position:fixed; top:0; left:-300px; height:100%; z-index:1000; transition:left 0.3s ease; }
  .sidebar.show { left:0; }
  .main-content { margin-left:0; padding:8px; }
  .card { width:100%; }
}
</style>
</head>
<body>

<div class="topbar">
  <button id="btnShowAddProperty" class="btn">Add Property</button>
  <button id="btnShowMyProperties" class="btn ghost">My Properties</button>
  <button id="btnShowMap" class="btn ghost">Map</button>
  <button id="btnLogout" class="btn hidden">Logout</button>
</div>


<!-- Main content -->
<div class="main-content">

  <!-- Agreement / Payment -->
  <div id="agreementSection" class="agree-box card">
    <h2>Agreement</h2>
    <p class="small">Registration fee: KSh 300. Commission: 10% of rent.</p>
    <div class="card" style="margin-top:8px">
      <h4>Paybill / Pochi La Biashara: 0115613332</h4>
      <p class="small">After payment, enter phone + transaction code below.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <input id="pay_phone" class="input" placeholder="Phone used (07... )">
        <input id="pay_tx" class="input" placeholder="MPESA Transaction Code">
        <button id="btnSubmitPayment" class="btn">Submit Payment</button>
      </div>
    </div>
  </div>

  <!-- Register -->
  <div id="registerSection" class="container hidden">
    <div class="card">
      <h3>Register</h3>
      <div style="display:flex;gap:8px; flex-wrap:wrap">
        <input id="reg_name" class="input" placeholder="Full name">
        <input id="reg_email" class="input" placeholder="Email">
        <input id="reg_password" class="input" placeholder="Password" type="password">
        <button id="btnRegister" class="btn">Register</button>
      </div>
    </div>
  </div>

  <!-- Login -->
  <div id="loginSection" class="container hidden">
    <div class="card">
      <h3>Login</h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <input id="login_email" class="input" placeholder="Email">
        <input id="login_password" class="input" placeholder="Password" type="password">
        <button id="btnLogin" class="btn">Login</button>
      </div>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dashboardSection" class="container hidden">

    <!-- Add Property -->
    <div id="addPropertySection" class="card hidden">
      <h4>Add Property</h4>
      <input id="prop_title" class="input" placeholder="Property title">
      <div style="display:flex;gap:8px;flex-wrap:wrap"><br>
        <input id="prop_price" class="input" placeholder="Monthly rent (KSh)" type="number">
        <input id="prop_deposit" class="input" placeholder="Deposit (KSh)" type="number">
      </div><br>
      <textarea id="prop_address" class="input" placeholder="Address"></textarea>
      <input id="prop_university" class="input" placeholder="Nearby campus (optional)">
      <div style="margin-top:8px">
        <label class="small">Photos (max 6)</label>
        <input id="prop_photos" type="file" multiple accept="image/*">
        <div id="photosPreview" style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
      </div><br>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
        <input id="prop_lat" class="input" placeholder="Latitude">
        <input id="prop_lng" class="input" placeholder="Longitude">
        <button id="btnGeocode" class="btn">Geocode</button>
        <button id="btnGetLocation" class="btn">Use My Location</button>
      </div><br>
      <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
        <button id="btnSaveProperty" class="btn">Save Property</button>
        <button id="btnClear" class="btn ghost">Clear</button>
      </div>
    </div>

    <!-- My Properties -->
    <div id="myPropertiesSection" class="card hidden">
      <h3>Your Properties <span class="small">(<span id="propCount">0</span>)</span></h3>
      <div id="myPropsList"></div>
    </div>

    <!-- Map -->
    <div id="mapSection" class="card hidden">
      <h4>Map Preview</h4>
      <div id="map" style="height:400px;border-radius:8px;background:#eef6fb"></div>
    </div>

  </div>
</div>

<script>
// Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyBNI_Pb_54NMvte-m6oYnwlpTikaqmHxqQ",
  authDomain: "campus-rent-7d1ef.firebaseapp.com",
  databaseURL: "https://campus-rent-7d1ef-default-rtdb.firebaseio.com",
  projectId: "campus-rent-7d1ef",
  storageBucket: "campus-rent-7d1ef.appspot.com",
  messagingSenderId: "849345981750",
  appId: "1:849345981750:web:a787bab1e485aa631b5797"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const firestore = firebase.firestore();
const rtdb = firebase.database();
const $ = id => document.getElementById(id);

let currentUser = null, editingId = null;
const agreementSection = $('agreementSection'), registerSection = $('registerSection'), loginSection = $('loginSection'), dashboardSection = $('dashboardSection');
const addPropertySection = $('addPropertySection'), myPropertiesSection = $('myPropertiesSection'), mapSection = $('mapSection');
const btnLogout = $('btnLogout'), btnSubmitPayment = $('btnSubmitPayment'), btnRegister = $('btnRegister'), btnLogin = $('btnLogin');
const prop_photos = $('prop_photos'), photosPreview = $('photosPreview'), btnSaveProperty = $('btnSaveProperty'), btnClear = $('btnClear'), propCount = $('propCount'), myPropsList = $('myPropsList');

// Sidebar buttons
$('btnShowAddProperty').onclick = ()=>showDashboardSubSection(addPropertySection);
$('btnShowMyProperties').onclick = ()=>showDashboardSubSection(myPropertiesSection);
$('btnShowMap').onclick = ()=>showDashboardSubSection(mapSection);

// Initialize map
let map = L.map('map').setView([-1.286389,36.817223],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{ attribution:'© OpenStreetMap' }).addTo(map);
let marker = L.marker([-1.286389,36.817223], {draggable:true}).addTo(map);
marker.on('dragend', ()=>{ const pos=marker.getLatLng(); $('prop_lat').value=pos.lat; $('prop_lng').value=pos.lng; });

// Payment
btnSubmitPayment.onclick = async ()=>{
  const phone = $('pay_phone').value.trim(), tx = $('pay_tx').value.trim();
  if(!phone||!tx) return alert('Enter phone & transaction code');
  await firestore.collection('payments').doc(phone).set({phone,txCode:tx,status:'paid',paidAt:Date.now()});
  localStorage.setItem('paidPhone',phone);
  showSection(registerSection);
};

// Register
btnRegister.onclick = async ()=>{
  const name = $('reg_name').value.trim(), email = $('reg_email').value.trim(), pass = $('reg_password').value;
  if(!email||!pass) return alert('Email & password required');
  const cred = await auth.createUserWithEmailAndPassword(email,pass);
  await cred.user.updateProfile({displayName:name||''});
  const phone = localStorage.getItem('paidPhone');
  await firestore.collection('landlords').doc(cred.user.uid).set({name,email,paymentPhone:phone,paymentStatus:'paid',createdAt:Date.now()});
  showSection(loginSection);
};

// Login
btnLogin.onclick = async ()=>{
  const email = $('login_email').value.trim(), pass = $('login_password').value;
  if(!email||!pass) return alert('Email & password required');
  await auth.signInWithEmailAndPassword(email,pass);
};

// Logout
btnLogout.onclick = ()=>auth.signOut();

// Auth state
auth.onAuthStateChanged(user=>{
  currentUser=user;
  if(user){
    btnLogout.classList.remove('hidden');
    showSection(dashboardSection);
    showDashboardSubSection(addPropertySection);
    loadPropertiesForUser();
  } else {
    btnLogout.classList.add('hidden');
    showSection(agreementSection);
  }
});

// Photos preview
prop_photos.addEventListener('change', e=>{
  photosPreview.innerHTML='';
  Array.from(e.target.files||[]).slice(0,6).forEach(f=>{
    const img=document.createElement('img');
    img.src=URL.createObjectURL(f);
    img.style.width='120px'; img.style.height='80px'; img.style.objectFit='cover'; img.style.borderRadius='6px';
    photosPreview.appendChild(img);
  });
});

// File to Base64
async function fileToBase64(file){ return new Promise(res=>{ const fr=new FileReader(); fr.onload=e=>res(e.target.result); fr.readAsDataURL(file); }); }

// Clear form
btnClear.onclick = ()=>{
  $('prop_title').value=''; $('prop_price').value=''; $('prop_deposit').value='';
  $('prop_address').value=''; $('prop_lat').value=''; $('prop_lng').value=''; $('prop_university').value='';
  prop_photos.value=''; photosPreview.innerHTML=''; btnSaveProperty.innerText='Save Property'; editingId=null;
};

// Save/Update property
btnSaveProperty.onclick = async ()=>{
  if(!currentUser) return alert('Login required');
  const title=$('prop_title').value.trim(), price=parseFloat($('prop_price').value),
        deposit=parseFloat($('prop_deposit').value), address=$('prop_address').value.trim(),
        lat=parseFloat($('prop_lat').value), lng=parseFloat($('prop_lng').value), uni=$('prop_university').value.trim();
  if(!title||!price||!address||!lat||!lng) return alert('Fill required fields');
  let photosBase64 = [];
  if(prop_photos.files.length) photosBase64 = await Promise.all(Array.from(prop_photos.files).slice(0,6).map(fileToBase64));

  if(editingId){
    await firestore.collection('properties').doc(editingId).update({title,price,deposit,address,lat,lng,uni,landlordId:currentUser.uid});
    if(photosBase64.length) await rtdb.ref('propertyImages/'+editingId).set({images:photosBase64});
    alert('Property updated!');
    editingId=null;
    btnSaveProperty.innerText='Save Property';
  } else {
    const docRef = await firestore.collection('properties').add({title,price,deposit,address,lat,lng,uni,createdAt:Date.now(),landlordId:currentUser.uid});
    if(photosBase64.length) await rtdb.ref('propertyImages/'+docRef.id).set({images:photosBase64});
    alert('Property saved!');
  }
  btnClear.onclick();
  loadPropertiesForUser();
};

// Load properties
async function loadPropertiesForUser(){
  if(!currentUser) return;
  const snap = await firestore.collection('properties').get();
  const props = [];
  snap.forEach(doc=>{ const p=doc.data(); p.id=doc.id; if(p.landlordId===currentUser.uid) props.push(p); });
  propCount.innerText = props.length;
  myPropsList.innerHTML='';

  for(const p of props){
    const card=document.createElement('div'); card.className='card'; card.style.width='260px';
    let photos=[];
    const photosSnap = await rtdb.ref('propertyImages/'+p.id+'/images').get();
    if(photosSnap.exists()) photos=Object.values(photosSnap.val());
    const firstImg = photos[0] || 'https://via.placeholder.com/250x140?text=No+Image';
    card.innerHTML = `
      <img src="${firstImg}" style="width:100%;height:140px;margin-bottom:6px">
      <h4 style="margin:4px 0">${p.title}</h4>
      <p style="margin:0 0 4px"><b>KSh ${p.price}</b> / month</p>
      <p style="margin:0 0 4px">${p.address}</p>
      <div style="display:flex;gap:8px;margin-top:auto">
        <button class="btn btn-edit" data-id="${p.id}">Edit</button>
        <button class="btn btn-delete" data-id="${p.id}">Delete</button>
      </div>
    `;
    myPropsList.appendChild(card);

    card.querySelector('.btn-edit').onclick=()=>{
      editingId=p.id;
      $('prop_title').value=p.title; $('prop_price').value=p.price; $('prop_deposit').value=p.deposit;
      $('prop_address').value=p.address; $('prop_lat').value=p.lat; $('prop_lng').value=p.lng;
      $('prop_university').value=p.uni||'';
      photosPreview.innerHTML='';
      photos.forEach(img=>{ const im=document.createElement('img'); im.src=img; im.style.width='120px'; im.style.height='80px'; im.style.objectFit='cover'; im.style.borderRadius='6px'; photosPreview.appendChild(im); });
      btnSaveProperty.innerText='Update Property';
    };

    card.querySelector('.btn-delete').onclick=async()=>{ 
      if(confirm('Delete this property?')){
        await firestore.collection('properties').doc(p.id).delete(); 
        await rtdb.ref('propertyImages/'+p.id).remove(); 
        loadPropertiesForUser(); 
      }
    };
  }
}

// Geocode & Use location
$('btnGeocode').addEventListener('click', async () => {
  const addr = $('prop_address').value.trim();
  if(!addr) return alert('Enter address to geocode');
  const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(addr + ' Kenya');
  const r = await fetch(url); const data = await r.json();
  if(data && data.length){
    const lat=parseFloat(data[0].lat), lng=parseFloat(data[0].lon);
    $('prop_lat').value=lat; $('prop_lng').value=lng;
    map.setView([lat,lng],15); marker.setLatLng([lat,lng]);
  } else alert('Location not found');
});

$('btnGetLocation').addEventListener('click', ()=>{
  if(!navigator.geolocation) return alert('Geolocation not supported');
  navigator.geolocation.getCurrentPosition(pos=>{
    const lat=pos.coords.latitude, lng=pos.coords.longitude;
    $('prop_lat').value=lat; $('prop_lng').value=lng;
    map.setView([lat,lng],15); marker.setLatLng([lat,lng]);
  }, err=>alert('Failed: '+err.message), {enableHighAccuracy:true});
});

// Helpers
function showSection(section){
  [agreementSection, registerSection, loginSection, dashboardSection].forEach(sec=>sec===section?sec.classList.remove('hidden'):sec.classList.add('hidden'));
}
function showDashboardSubSection(subSection){
  [addPropertySection, myPropertiesSection, mapSection].forEach(s=>s===subSection?s.classList.remove('hidden'):s.classList.add('hidden'));
}
</script>

</body>
</html>
